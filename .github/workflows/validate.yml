name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 領土図のセル収支
        run: python3 scripts/count_territories.py design/territories-v08.txt
      - name: 配置データの検証
        run: python3 scripts/validate_layout.py data/layout-v08.json
      - name: docs/data が data と同期しているか
        run: |
          cmp data/layout-v08.json docs/data/layout-v08.json
          cmp data/municipalities.json docs/data/municipalities.json
          cmp data/sapporo-wards.json docs/data/sapporo-wards.json
          cmp data/board.csv docs/data/board.csv
          cmp data/board-with-villages.csv docs/data/board-with-villages.csv
