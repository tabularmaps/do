<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabularmaps 北海道 — 単体プレビュー</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { margin: 0; background: #f9f9f7; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #0b0b0b; }
      @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fff; } }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .panel { height: 78vh; min-height: 520px; border: 1px solid #e1e0d9; border-radius: 6px; overflow: hidden; }
      .picker { margin: 0 0 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      select { font: inherit; }
      p.note { font-size: 12px; color: #52514e; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="picker">
        <label>指標:
          <select id="source"><option value="">(なし: 振興局の色)</option></select>
        </label>
        <span id="status"></span>
      </div>
      <div class="panel" id="panel"></div>
      <p class="note">Open MCT なしで描画コアだけを確認するページ。本番ダッシュボードは <a href="./index.html">index.html</a>。</p>
    </div>
    <script src="./tabularmap.js"></script>
    <script src="./demo-sources.js"></script>
    <script>
      (async function () {
        const [layout, municipalities, wards] = await Promise.all([
          fetch('./data/layout-v07.json').then((r) => r.json()),
          fetch('./data/municipalities.json').then((r) => r.json()),
          fetch('./data/sapporo-wards.json').then((r) => r.json())
        ]);
        const map = TabularMap.create(document.getElementById('panel'), {
          layout, municipalities, wards, mode: 'region',
          onSelect: (code, cell) => { document.getElementById('status').textContent = `選択: ${cell.name} (${code})`; }
        });
        const sel = document.getElementById('source');
        for (const s of TABULARMAPS_DEMO_SOURCES) {
          const o = document.createElement('option'); o.value = s.key; o.textContent = s.name; sel.appendChild(o);
        }
        let timer = null;
        sel.addEventListener('change', async () => {
          if (timer) clearInterval(timer);
          const s = TABULARMAPS_DEMO_SOURCES.find((x) => x.key === sel.value);
          if (!s) { map.setSeries(null); map.setMode('region'); return; }
          const tick = async () => map.setSeries(await s.fetchValues());
          await tick();
          if (s.refreshMs) timer = setInterval(tick, s.refreshMs);
        });
        window.__tm = map;
      })();
    </script>
  </body>
</html>
